<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda</title>
    <link rel="stylesheet" href="beranda.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>
<div class="app-container">
    <header>
        <div class="profile-icon">
            <i class="fas fa-user"></i>
        </div>

        <div class="logo">RUN<span class="highlight">S</span>TART</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Program</a></li>
                <li><a href="#">Calculator</a></li>
                
            </ul>
        </nav>
    </header>

    <main>

        <section class="hero-card">
            <div class="hero-img"></div>
            <div class="hero-content">
                <h2>Program Latihan Lari</h2>
                <p>Mulai lari dengan aman, terukur dan terstruktur</p>
                <button class="btnprimary">Mulai Latihan</button>
            </div>
        </section>

        <section class="calc-section">
            <div class="calc-header">
                <i class="fas fa-clock"></i>
                <h3>Kalkulator Pace Lari</h3>
            </div>

            <div class="form-group">
                <label for="jarak">Jarak (KM)</label>
                <input type="number" placeholder="0">
            </div>

            <div class="form-group">
                <label for="waktu">Waktu (Menit)</label>
                <input type="number" placeholder="0">
            </div>

            <div class="calc-footer">
                <button class="btnprimary">Hitung Pace</button>
            </div>
        </section>
    </main>


</div>
</body>
</html>
